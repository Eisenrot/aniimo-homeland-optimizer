<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d10">
  <meta name="aniimo-build" content="experimental-legacy">
  <title>Aniimo Homeland Optimizer · Legacy reference</title>
  <meta name="description" content="Legacy reference UI preserved on the experimental migration branch.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./super.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark" role="img" aria-label="Aniimo"></div><div><h1>Aniimo Homeland Optimizer</h1><p>legacy reference · experimental branch</p></div></div>
    <nav class="top-actions"><a class="ghost link" href="./">Modern rewrite</a></nav>
  </header>
  <div id="ownership-overlay" class="ownership-overlay" aria-hidden="true">
    <div id="ownership-modal" class="ownership-modal" role="dialog" aria-modal="true" aria-label="Aniimo you own">
      <button id="ownership-close" class="modal-close" aria-label="Close Aniimo roster">×</button>
      <section class="panel ownership-modal-panel" id="ownership-panel"></section>
    </div>
  </div>
  <main class="shell">
    <section class="panel import-panel">
      <div class="section-title"><span></span><h3>Import / share</h3><i></i><em id="data-version" class="micro"></em></div>
      <div class="import-row"><input id="import-url" type="text" placeholder="Paste a Hideout link or this optimizer's share link…"><button id="import-btn" class="primary">Import</button><button id="reset-btn" class="ghost">Reset</button></div>
      <p class="micro">Preserved reference implementation. It uses the same state store as the modern rewrite.</p>
    </section>
    <div class="workspace">
      <aside class="config-stack">
        <section class="panel" id="objective-panel"></section>
        <section class="panel" id="general-panel"></section>
        <section class="panel" id="facilities-panel"></section>
        <section class="panel" id="modules-panel"></section>
        <section class="panel" id="notes-panel"></section>
        <section class="panel" id="living-panel"></section>
      </aside>
      <section class="results-stack">
        <section class="panel" id="plan-panel"></section>
        <section class="panel" id="climate-panel" hidden></section>
        <section class="panel" id="outputs-panel"></section>
        <section class="panel" id="abilities-panel"></section>
        <section class="panel" id="team-panel"></section>
      </section>
    </div>
  </main>
  <footer><span>Legacy reference for migration parity.</span><span>Solver logic still runs entirely in your browser.</span></footer>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/super.js"></script>
</body>
</html>
