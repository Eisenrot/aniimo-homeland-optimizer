name: Experimental React migration

on:
  push:
    branches:
      - experiment/react-ts-vite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install modern toolchain
        run: npm install --no-audit --no-fund

      - name: Typecheck and build modern app
        run: |
          npm run typecheck
          npm run build
          test -f dist/index.html
          test -f dist/optimizer.html
          test -f dist/homeland.html
          test -f dist/team.html
          test -f dist/layout.html
          test -f dist/roster.html
          test -f dist/legacy.html

      - name: Verify legacy solver regressions
        run: |
          node test.mjs
          node test-team.mjs
          node test-climate.mjs
          node test-full-layout.mjs
          node test-speed.mjs
          node test-recipe-notes.mjs
          node test-progression.mjs
          node test-aniimax-parity.mjs

      - name: Benchmark JS simplex vs HiGHS
        run: npm run benchmark:lp
