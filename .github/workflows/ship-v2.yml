name: Ship v2 standalone optimizer

on:
  push:
    branches: [main]
    paths:
      - ".migration/v2/**"
      - ".github/workflows/ship-v2.yml"

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct tested v2 package
        run: |
          set -euo pipefail
          rm -rf /tmp/aniimo-v2 /tmp/aniimo-v2.zip
          mkdir -p /tmp/aniimo-v2
          cat .migration/v2/chunk* | base64 -d > /tmp/aniimo-v2.zip
          echo "9a4871e5e009ae6de8d7a61e6f20bfe47abb621a6b3d234ad1a114d827d67bc5  /tmp/aniimo-v2.zip" | sha256sum -c -
          unzip -q /tmp/aniimo-v2.zip -d /tmp/aniimo-v2
          test -f /tmp/aniimo-v2/index.html
          test -f /tmp/aniimo-v2/styles.css
          test -f /tmp/aniimo-v2/src/app.js
          test -f /tmp/aniimo-v2/src/optimizer.js
          test -f /tmp/aniimo-v2/src/defaults.js

      - name: Overlay v2 onto visible repository source
        run: |
          set -euo pipefail
          cp -a /tmp/aniimo-v2/. .
          rm -rf .migration
          rm -f .github/workflows/ship-v2.yml

      - name: Verify syntax and optimizer behavior
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/optimizer.js
          node --check src/defaults.js
          node test.mjs
          node test-team.mjs

      - name: Commit the real source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ship standalone full Homeland optimizer"
          git push origin HEAD:main
