name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f super.css
          test -f src/app.js
          test -f src/optimizer.js
          test -f src/super.js
          node --check src/app.js
          node --check src/optimizer.js
          node --check src/super.js
          node --check src/progression.js
          node test.mjs
          node test-team.mjs
          node test-progression.mjs
          node test-speed.mjs
          node test-recipe-notes.mjs

      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html styles.css super.css .nojekyll _site/
          cp -a src _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
