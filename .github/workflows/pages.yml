name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify optimizer
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          node test.mjs
          node test-team.mjs
          node test-roster-aware.mjs
          node test-objective-explanation.mjs
          node test-pals.mjs
          node test-climate.mjs
          node test-plan-cache.mjs
          node test-full-layout.mjs
          node test-progression.mjs
          node test-speed.mjs
          node test-recipe-notes.mjs
          node test-presets.mjs
          node test-aniimax-parity.mjs
          test -f dist/index.html
          test -f dist/team.html
          test -f dist/layout.html
          test -f dist/optimizer.html
          test -f dist/homeland.html
          test -f dist/roster.html
          cp .nojekyll dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
