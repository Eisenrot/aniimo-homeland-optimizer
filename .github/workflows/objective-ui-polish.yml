name: Objective UI polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/objective-ui-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply objective and scaling polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, found {n}")
              p.write_text(s.replace(old,new,count))

          def must_sub(path, pattern, repl, count=1):
              p=Path(path); s=p.read_text()
              out,n=re.subn(pattern,repl,s,count=count,flags=re.S)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} regex matches, found {n}")
              p.write_text(out)

          # Header: remove the placeholder A and use an official Aniimo PNG as the mark.
          must_replace(
              "index.html",
              '<div class="brand"><div class="brand-mark">A</div><div><h1>Aniimo Homeland Optimizer</h1><p>production · staffing · personalities</p></div></div>',
              '<div class="brand"><div class="brand-mark" role="img" aria-label="Aniimo"></div><div><h1>Aniimo Homeland Optimizer</h1><p>production · staffing · personalities</p></div></div>'
          )

          # State: preserve co-max flags across old local saves and share links.
          must_replace(
              "src/app.js",
              "x.recipeNotes={...(s?.recipeNotes||{})};x.guarantees=Array.isArray(s?.guarantees)?s.guarantees.map(g=>({item:String(g.item||''),perHour:Math.max(0,Number(g.perHour||0))})):[];x.target=String(x.target||'coin');",
              "x.recipeNotes={...(s?.recipeNotes||{})};x.guarantees=Array.isArray(s?.guarantees)?s.guarantees.map(g=>({item:String(g.item||''),perHour:Math.max(0,Number(g.perHour||0)),maximize:!!g.maximize})):[];x.target=String(x.target||'coin');"
          )
          must_replace(
              "src/app.js",
              "if(q.has('g'))state.guarantees=q.get('g').split('.').map(x=>{const[id,n]=x.split('-');return{item:id,perHour:Number(n)||0};}).filter(x=>x.item&&x.perHour>0);",
              "if(q.has('g'))state.guarantees=q.get('g').split('.').map(x=>{const[id,n]=x.split('-');return{item:id,perHour:Number(n)||0,maximize:false};}).filter(x=>x.item);if(q.has('mx')){const maxItems=new Set(q.get('mx').split('.'));for(const g of state.guarantees)g.maximize=maxItems.has(String(g.item));}"
          )
          must_replace(
              "src/app.js",
              "const owned=DATA.pals.filter(p=>state.owned[String(p.id)]?.enabled).map(p=>p.id).join('.'),copies=DATA.pals.filter(p=>state.owned[String(p.id)]?.enabled&&Number(state.owned[String(p.id)].count)>1).map(p=>`${p.id}-${state.owned[String(p.id)].count}`).join('.'),cl=Object.entries(state.climateOptions).filter(([,v])=>v).map(([k])=>k).join('.'),g=(state.guarantees||[]).filter(x=>Number(x.perHour)>0).map(x=>`${x.item}-${x.perHour}`).join('.');",
              "const owned=DATA.pals.filter(p=>state.owned[String(p.id)]?.enabled).map(p=>p.id).join('.'),copies=DATA.pals.filter(p=>state.owned[String(p.id)]?.enabled&&Number(state.owned[String(p.id)].count)>1).map(p=>`${p.id}-${state.owned[String(p.id)].count}`).join('.'),cl=Object.entries(state.climateOptions).filter(([,v])=>v).map(([k])=>k).join('.'),g=(state.guarantees||[]).filter(x=>x.item).map(x=>`${x.item}-${Number(x.perHour)||0}`).join('.'),mx=(state.guarantees||[]).filter(x=>x.item&&x.maximize).map(x=>x.item).join('.');"
          )
          must_replace(
              "src/app.js",
              "for(const[k,v]of[['f',f],['m',m],['y',y],['a',state.abilityLevel],['h',state.homelandLevel],['w',state.workerSlots],['tw',state.teamSlots],['collect',state.collectHours],['one',state.oneRecipePerFacility?1:0],['cl',cl],['gen',state.generatorAvailable?1:0],['hungry',state.hungry?1:0],['target',state.target],['p',owned]])",
              "for(const[k,v]of[['f',f],['m',m],['y',y],['a',state.abilityLevel],['h',state.homelandLevel],['w',state.workerSlots],['tw',state.teamSlots],['collect',state.collectHours],['one',state.oneRecipePerFacility?1:0],['cl',cl],['gen',state.generatorAvailable?1:0],['hungry',state.hungry?1:0],['target',state.target],['mx',mx],['p',owned]])"
          )
          must_replace(
              "src/app.js",
              "['f','m','y','a','h','w','tw','p','c','collect','one','cl','gen','hungry','target','g']",
              "['f','m','y','a','h','w','tw','p','c','collect','one','cl','gen','hungry','target','g','mx']"
          )

          objective_block = r'''function targetItems(){const ids=new Set(DATA.recipes.flatMap(r=>(r.outputs||[]).map(o=>Number(o.item))));return[...ids].map(id=>({id,name:itemName(DATA,id),value:itemValue(DATA,id)})).sort((a,b)=>a.name.localeCompare(b.name));}
          const HOME_COIN_ICON='https://aniipedia.com/items/v/tl98fh/1010.webp';
          function itemIcon(value){return String(value)==='coin'?HOME_COIN_ICON:`${HIDEOUT}/images/aniimo/database/materials/item_${value}.webp`;}
          function itemChoice(value){if(String(value)==='coin')return{id:'coin',name:'Home Coin',value:0,icon:itemIcon('coin')};const id=String(value||'');return{id,name:itemName(DATA,id),value:itemValue(DATA,id),icon:itemIcon(id)};}
          function pickerMenu(includeCoin,current){
            const items=targetItems(),zero=items.filter(x=>x.value<=0),sold=items.filter(x=>x.value>0);
            const option=x=>`<button type="button" class="item-option ${String(current)===String(x.id)?'selected':''}" data-value="${x.id}" role="option" aria-selected="${String(current)===String(x.id)}"><img loading="lazy" decoding="async" src="${itemIcon(x.id)}" alt="" onerror="this.style.opacity='.15'"><span>${esc(x.name)}</span></button>`;
            return `${includeCoin?option({id:'coin',name:'Home Coin'}):''}<div class="item-group-title">Does not sell</div>${zero.map(option).join('')}<div class="item-group-title">Crafting / sellable materials</div>${sold.map(option).join('')}`;
          }
          function itemPicker(value,includeCoin,picker,index=''){
            const current=itemChoice(value);
            return`<div class="item-picker" data-picker="${picker}" data-i="${index}"><button type="button" class="item-picker-button" aria-haspopup="listbox" aria-expanded="false"><img src="${current.icon}" alt="" onerror="this.style.opacity='.15'"><span>${esc(current.name)}</span><i>⌄</i></button><div class="item-picker-menu" role="listbox">${pickerMenu(includeCoin,value)}</div></div>`;
          }
          function bindItemPickers(){
            const closeAll=()=>document.querySelectorAll('.item-picker-menu.open').forEach(m=>{m.classList.remove('open');m.previousElementSibling?.setAttribute('aria-expanded','false');});
            document.querySelectorAll('.item-picker').forEach(p=>{
              const trigger=p.querySelector('.item-picker-button'),menu=p.querySelector('.item-picker-menu');
              trigger.onclick=e=>{e.stopPropagation();const opening=!menu.classList.contains('open');closeAll();if(opening){menu.classList.add('open');trigger.setAttribute('aria-expanded','true');}};
              p.querySelectorAll('.item-option').forEach(o=>o.onclick=e=>{e.stopPropagation();const value=o.dataset.value;if(p.dataset.picker==='target')state.target=value;else{const i=Number(p.dataset.i);if(state.guarantees[i])state.guarantees[i].item=value;}saveState();renderObjectives();scheduleCompute();});
            });
            if(!document.documentElement.dataset.itemPickerClose){document.addEventListener('click',closeAll);document.documentElement.dataset.itemPickerClose='1';}
          }
          function renderObjectives(){
            const joint=(state.guarantees||[]).filter(g=>g.maximize).length;
            $('#objective-panel').innerHTML=title('Objective')+`<div class="grid2"><div class="field"><label>Maximise</label>${itemPicker(state.target,true,'target')}</div><div class="field"><label>Goal (optional)</label><input id="goal" type="number" min="0" placeholder="e.g. 500000" value="${esc(state.goal||'')}"></div></div><div class="micro-label objective-subtitle" style="margin-top:10px"><span>Also make at least</span>${joint?`<b>${joint} co-max objective${joint===1?'':'s'}</b>`:''}</div><div id="guarantees">${(state.guarantees||[]).map((g,i)=>guaranteeRow(g,i)).join('')}</div><div class="objective-actions"><button id="add-guarantee" class="ghost">+ another requirement</button><button id="clear-guarantees" class="ghost">Clear requirements</button></div><p class="micro">The number is always items per hour. A requirement is a hard minimum. Tick <b>MAX</b> and that item also becomes a normalised co-objective with the main target, so very different numeric scales do not bully each other.</p>`;
            $('#goal').oninput=e=>{state.goal=e.target.value;saveState();renderPlan();};
            $('#add-guarantee').onclick=()=>{const first=targetItems()[0];state.guarantees.push({item:String(first?.id||''),perHour:1,maximize:false});saveState();renderObjectives();scheduleCompute();};
            $('#clear-guarantees').onclick=()=>{state.guarantees=[];saveState();renderObjectives();scheduleCompute();};
            document.querySelectorAll('.guarantee-rate').forEach(i=>i.oninput=e=>{state.guarantees[Number(e.target.dataset.i)].perHour=Math.max(0,Number(e.target.value)||0);saveState();scheduleCompute();});
            document.querySelectorAll('.guarantee-max').forEach(i=>i.onchange=e=>{state.guarantees[Number(e.target.dataset.i)].maximize=e.target.checked;saveState();scheduleCompute();});
            document.querySelectorAll('.guarantee-remove').forEach(b=>b.onclick=()=>{state.guarantees.splice(Number(b.dataset.i),1);saveState();renderObjectives();scheduleCompute();});
            bindItemPickers();
          }
          function guaranteeRow(g,i){return`<div class="objective-row">${itemPicker(g.item,false,'guarantee',i)}<label class="rate-field" title="Minimum items per hour"><input class="guarantee-rate" data-i="${i}" type="number" min="0" step="any" value="${g.perHour||0}" aria-label="How many per hour"><span>/h</span></label><label class="maximize-toggle" title="Also maximise this item together with the main objective"><input class="guarantee-max" data-i="${i}" type="checkbox" ${g.maximize?'checked':''}><span>MAX</span></label><button class="ghost guarantee-remove" data-i="${i}" aria-label="Remove">×</button></div>`;}
          '''
          must_sub(
              "src/app.js",
              r"function targetItems\(\).*?function guaranteeRow\(g,i\)\{.*?\}\n\n(?=function scheduleCompute)",
              objective_block + "\n"
          )

          # Plan copy should acknowledge a joint objective when one is active.
          must_replace(
              "src/app.js",
              '<span>maximised output</span>',
              "<span>${(state.guarantees||[]).some(g=>g.maximize)?'jointly maximised':'maximised output'}</span>"
          )

          # Objective math: co-max items are normalised to a common 0..1-ish scale and summed.
          must_replace(
              "src/optimizer.js",
              "function objectiveCoef(recipe,state,data){return state.target&&state.target!=='coin'?recipeNetItem(recipe,state.target):recipeNetValue(recipe,data);}",
              r'''function objectiveSpecs(state,data){
            const primary=state.target&&state.target!=='coin'?String(state.target):'coin',seen=new Set([primary]),out=[{key:'primary',item:primary,label:primary==='coin'?'Home Coin':itemName(data,primary)}];
            for(const g of state.guarantees||[]){const item=String(g.item||'');if(!g.maximize||!item||seen.has(item))continue;seen.add(item);out.push({key:`co:${item}`,item,label:itemName(data,item)});}
            return out;
          }
          function objectivePartCoef(recipe,spec,data){return spec.item==='coin'?recipeNetValue(recipe,data):recipeNetItem(recipe,spec.item);}
          function objectiveCoef(recipe,state,data){return objectivePartCoef(recipe,objectiveSpecs(state,data)[0],data);}
          function buildObjectiveWeights(recipes,state,data,A,b){
            const specs=objectiveSpecs(state,data);if(specs.length===1)return[{...specs[0],scale:1,normalizer:1,max:null}];
            const out=[];for(const spec of specs){const c=recipes.map(r=>objectivePartCoef(r,spec,data)),solved=solveLp(c,A,b);let max=0;if(solved)for(let i=0;i<c.length;i++)max+=c[i]*Number(solved.x[i]||0);if(spec.key==='primary'||max>1e-8){const normalizer=Math.max(1e-8,Math.abs(max));out.push({...spec,scale:1/normalizer,normalizer,max});}}
            return out.length?out:[{...specs[0],scale:1,normalizer:1,max:null}];
          }
          function combinedObjectiveCoef(recipe,state,data,weights=null){const ws=weights?.length?weights:[{...objectiveSpecs(state,data)[0],scale:1}];return ws.reduce((sum,w)=>sum+objectivePartCoef(recipe,w,data)*Number(w.scale||0),0);}'''
          )

          raw_opt = r'''function rawOptimize(state,data,scenario,allowRecipes=null,forcedWeights=null){
            let recipes=data.recipes.filter(r=>recipeRunnable(r,state,data,scenario));if(allowRecipes)recipes=recipes.filter(r=>allowRecipes.has(r.id));
            if(!recipes.length)return{ratePerHour:0,targetRate:0,objectiveRate:0,rows:[],runnableRecipes:[],scenario,scenarioLabel:scenarioLabel(scenario),utilityWorkers:utilityWorkerCount(scenario),infeasible:false,objectiveWeights:forcedWeights||[]};
            const n=recipes.length,A=[],b=[];
            addFacilityConstraints(A,b,recipes,state,data,scenario);
            const workerLimit=Number(state.workerSlots||0);if(workerLimit>0){A.push(recipes.map(r=>r.electric?0:recipeLaborSeconds(r,state,scenario)/3600));b.push(Math.max(0,workerLimit-utilityWorkerCount(scenario)));}
            addMaterialBalance(A,b,recipes,data);addGuarantees(A,b,recipes,state);
            const objectiveWeights=forcedWeights?.length?forcedWeights:buildObjectiveWeights(recipes,state,data,A,b),objective=recipes.map(r=>combinedObjectiveCoef(r,state,data,objectiveWeights));
            const solved=solveLp(objective,A,b);if(!solved)return{ratePerHour:0,targetRate:0,objectiveRate:-Infinity,rows:[],runnableRecipes:recipes,scenario,scenarioLabel:scenarioLabel(scenario),utilityWorkers:utilityWorkerCount(scenario),infeasible:true,objectiveWeights};
            const rows=[];let coin=0,target=0,obj=0;
            recipes.forEach((recipe,i)=>{const batches=Math.max(0,Number(solved.x[i]||0));if(batches<=1e-8)return;const parts=cycleParts(recipe,state,scenario),units=batches*parts.cycle/3600,coinPart=recipeNetValue(recipe,data)*batches,targetPart=state.target&&state.target!=='coin'?recipeNetItem(recipe,state.target)*batches:coinPart;coin+=coinPart;target+=targetPart;obj+=objective[i]*batches;rows.push({facility:recipe.facility,recipe,batchesPerHour:batches,units,perHour:coinPart,targetPerHour:targetPart,cycleSeconds:parts.cycle,manualSeconds:parts.manual,netValue:recipeNetValue(recipe,data)});});
            return{ratePerHour:coin,targetRate:target,objectiveRate:obj,rows,runnableRecipes:recipes,scenario,scenarioLabel:scenarioLabel(scenario),utilityWorkers:utilityWorkerCount(scenario),infeasible:false,objectiveWeights};
          }'''
          must_sub(
              "src/optimizer.js",
              r"function rawOptimize\(state,data,scenario,allowRecipes=null\)\{.*?\n\}\n\n(?=function oneRecipeOptimize)",
              raw_opt + "\n"
          )
          must_replace(
              "src/optimizer.js",
              "const solveSelected=sel=>rawOptimize(state,data,scenario,new Set([...fixed,...sel.values()]));",
              "const solveSelected=sel=>rawOptimize(state,data,scenario,new Set([...fixed,...sel.values()]),mixed.objectiveWeights);"
          )

          opt_plan = r'''export function optimizePlan(state,data){
            const scenarioList=scenarios(state),specs=objectiveSpecs(state,data);let sharedWeights=null;
            if(specs.length>1){
              const maxima=new Map(specs.map(s=>[s.key,0]));
              for(const scenario of scenarioList){const probe=rawOptimize(state,data,scenario);for(const w of probe.objectiveWeights||[])if(Number.isFinite(w.max)&&w.max>Number(maxima.get(w.key)||0))maxima.set(w.key,w.max);}
              sharedWeights=specs.map(spec=>{const max=Number(maxima.get(spec.key)||0),normalizer=Math.max(1e-8,Math.abs(max));return{...spec,scale:1/normalizer,normalizer,max};});
            }
            let best=null;const tested=[];
            for(const scenario of scenarioList){
              let plan=rawOptimize(state,data,scenario,null,sharedWeights);if(state.oneRecipePerFacility&&!plan.infeasible)plan=oneRecipeOptimize(state,data,scenario,plan);tested.push(plan);
              if(plan.infeasible)continue;
              if(!best||plan.objectiveRate>best.objectiveRate+1e-8||(Math.abs(plan.objectiveRate-best.objectiveRate)<=1e-8&&plan.utilityWorkers<best.utilityWorkers))best=plan;
            }
            if(!best)return{ratePerHour:0,targetRate:0,objectiveRate:0,rows:[],runnableRecipes:[],scenario:{},scenarioLabel:'No feasible plan',utilityWorkers:0,infeasible:true,tested,objectiveWeights:sharedWeights||[]};
            best.testedScenarios=tested.length;return best;
          }'''
          must_sub(
              "src/optimizer.js",
              r"export function optimizePlan\(state,data\)\{.*?\n\}\n\n(?=export function planItemRates)",
              opt_plan + "\n"
          )
          must_replace(
              "src/optimizer.js",
              "objective:objectiveCoef(recipe,state,data)",
              "objective:combinedObjectiveCoef(recipe,state,data,plan.objectiveWeights)",
              count=1
          )
          must_replace(
              "src/optimizer.js",
              "objective:objectiveCoef(r.recipe,model.state,model.data)",
              "objective:combinedObjectiveCoef(r.recipe,model.state,model.data,model.plan.objectiveWeights)",
              count=1
          )
          must_replace(
              "src/optimizer.js",
              "objective:objectiveCoef(row.recipe,model.state,model.data)",
              "objective:combinedObjectiveCoef(row.recipe,model.state,model.data,model.plan.objectiveWeights)",
              count=2
          )

          # Tests for the new co-max path.
          must_replace(
              "test.mjs",
              "import {optimizePlan,livingFacilityGroups} from './src/optimizer.js';",
              "import {optimizePlan,livingFacilityGroups,planItemRates} from './src/optimizer.js';"
          )
          anchor="const living=livingFacilityGroups(state,DATA);"
          joint="""const joint=clone(state);joint.guarantees=[{item:'4010169',perHour:0,maximize:true}];\nconst jointPlan=optimizePlan(joint,DATA);\nif((jointPlan.objectiveWeights||[]).length<2)throw new Error('co-max requirement did not become a second objective');\nconst rough=planItemRates(jointPlan,DATA).find(x=>x.item===4010169)?.rate||0;\nif(!(rough>0))throw new Error('co-max Rough Lumber objective produced no Rough Lumber');\n\n"""
          must_replace("test.mjs",anchor,joint+anchor)

          # 125% desktop scale, real Aniimo mark, and a custom icon picker / aligned objective row.
          must_replace(
              "styles.css",
              "*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}",
              "*{box-sizing:border-box}html{zoom:1.25;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}"
          )
          must_sub(
              "styles.css",
              r"\.brand-mark\{.*?\}h1\{",
              ".brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background-image:url('https://worldx-website-cdn.aniimo.com/official-website/worldx/office_global/1280X1280_c659bbadf2787246.PNG');background-size:330%;background-position:50% 78%;background-repeat:no-repeat;border:1px solid #495d74;box-shadow:0 0 0 3px rgba(103,179,255,.08),0 6px 18px rgba(0,0,0,.28)}h1{"
          )
          must_sub(
              "styles.css",
              r"\.objective-row\{.*?\}\.objective-actions\{.*?\}",
              r'''.objective-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 62px 32px;gap:6px;align-items:center;margin-top:6px}.objective-row>*{min-width:0}.item-picker{position:relative;min-width:0}.item-picker-button{height:32px;width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) 12px;align-items:center;gap:7px;border:1px solid #303741;background:#090b0e;color:#eef2f5;padding:4px 7px;cursor:pointer;text-align:left}.item-picker-button:hover,.item-picker-button[aria-expanded="true"]{border-color:#a62a3f}.item-picker-button img,.item-option img{width:22px;height:22px;object-fit:contain}.item-picker-button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.item-picker-button i{font-style:normal;color:#68727d;text-align:center}.item-picker-menu{display:none;position:absolute;z-index:90;top:calc(100% + 4px);left:0;width:max(100%,290px);max-height:330px;overflow:auto;border:1px solid #39414b;background:#0b0e12;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:4px}.item-picker-menu.open{display:block}.item-group-title{position:sticky;top:0;z-index:1;background:#11151a;color:#6f7a85;font-size:8px;letter-spacing:.13em;text-transform:uppercase;padding:7px 8px;border-bottom:1px solid #252c34}.item-option{width:100%;height:34px;display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:8px;border:0;background:transparent;color:#dbe1e7;padding:5px 7px;text-align:left;cursor:pointer}.item-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.item-option:hover{background:#171c22}.item-option.selected{background:rgba(212,45,70,.12);color:#fff}.rate-field{height:32px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border:1px solid #303741;background:#090b0e;cursor:text}.rate-field:focus-within{border-color:#a62a3f}.rate-field input{height:30px;border:0;padding:5px 3px 5px 7px;font-size:10px;text-align:right;background:transparent}.rate-field span{padding:0 7px 0 3px;color:#77818c;font-size:9px}.maximize-toggle{height:32px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #303741;background:#101419;color:#7f8993;cursor:pointer;padding:0 6px}.maximize-toggle input{margin:0}.maximize-toggle span{font-size:8px;font-weight:800;letter-spacing:.09em}.maximize-toggle:has(input:checked){border-color:#376d49;background:#102116;color:#8cf0aa}.guarantee-remove{height:32px;width:32px;padding:0!important;display:grid;place-items:center;font-size:15px;line-height:1}.objective-subtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.objective-subtitle b{font-size:8px;color:var(--green);font-weight:700;letter-spacing:.08em}.objective-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.objective-actions button{width:100%}'''
          )
          must_replace(
              "styles.css",
              "@media(max-width:680px){.shell{",
              "@media(max-width:680px){html{zoom:1}.shell{"
          )

          # The temporary patch workflow should not survive its own successful run.
          Path(".github/workflows/objective-ui-polish.yml").unlink()
          PY

      - name: Verify
        run: |
          set -euo pipefail
          node --check src/app.js
