name: Apply capacity and atomic state bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capacity-bridge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: python .github/scripts/capacity_patch.py
      - name: Verify
        run: |
          node --check src/app.js
          node test.mjs
          node test-team.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Homeland caps and atomic state bridge"
          git push origin HEAD:main
