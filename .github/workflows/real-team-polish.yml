name: Apply real team analyzer polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-team-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch analyzer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f"{path}: expected one match, got {s.count(old)}")
              p.write_text(s.replace(old,new,1))

          p=Path("src/optimizer.js")
          s=p.read_text()
          a=s.index("function chooseProfileHints(")
          b=s.index("\nfunction personalityEval",a)
          s=s[:a]+'''function chooseProfileHints(model,team,concreteEval,burst){
            const {weights,primary,rows}=workerFacilityWeights(model,team,concreteEval,burst),hints=[];
            for(let w=0;w<team.length;w++){
              const primaryLetters=new Map(),secondaryLetters=new Map(),primaryFacilities=new Map(),secondaryFacilities=new Map();
              for(const[f,v]of primary[w]){const l=FACILITY_PERSONALITY[f];if(!l)continue;primaryLetters.set(l,(primaryLetters.get(l)||0)+v);if(!primaryFacilities.has(l))primaryFacilities.set(l,new Set());primaryFacilities.get(l).add(f);}
              for(const row of rows){const l=FACILITY_PERSONALITY[row.facility];if(!l)continue;const tasks=taskObjects(row);if(tasks.some(t=>palCanDo(team[w].pal,t))){secondaryLetters.set(l,(secondaryLetters.get(l)||0)+Number(row.batchesPerHour||0)*Math.max(1,row.cycleSeconds));if(!secondaryFacilities.has(l))secondaryFacilities.set(l,new Set());secondaryFacilities.get(l).add(row.facility);}}
              const must=new Map();for(const pair of PERSONALITY_PAIRS){const choices=pair.filter(l=>primaryLetters.has(l));if(choices.length)must.set(pair.join(''),choices.sort((a,b)=>(primaryLetters.get(b)||0)-(primaryLetters.get(a)||0))[0]);}
              const candidates=PERSONALITY_PROFILES.filter(p=>[...must.entries()].every(([pair,l])=>p.includes(l))),score=p=>{let s=0;for(const l of p){s+=(primaryLetters.get(l)||0)*100+(secondaryLetters.get(l)||0);}return s;};
              let profile=candidates[0]||PERSONALITY_PROFILES[0],best=-Infinity;for(const p of candidates){const sc=score(p);if(sc>best+1e-8||(Math.abs(sc-best)<=1e-8&&p<profile)){best=sc;profile=p;}}
              const display=[];for(const pair of PERSONALITY_PAIRS){const key=pair.join(''),required=must.get(key);if(required)display.push({char:required,status:'must',facilities:[...(primaryFacilities.get(required)||[])]});else{const picked=pair.find(l=>profile.includes(l));if(picked&&(secondaryLetters.get(picked)||0)>0)display.push({char:picked,status:'nice',facilities:[...(secondaryFacilities.get(picked)||[])]});else display.push({char:'o',status:'none',facilities:[]});}}
              hints.push({profile,display,primaryLetters:[...primaryLetters.keys()],secondaryLetters:[...secondaryLetters.keys()]});
            }
            return hints;
          }
          '''+s[b:]
          p.write_text(s)

          p=Path("src/app.js"); s=p.read_text()
          anchor='''function palAbilityChip(p,ability){const[a,b]=palFallbackColors(p),src=palHeadIcon(p);return `<span class="pal-ability-chip" data-palette-src="${src}" style="--pal-a:${a};--pal-b:${b}"><img src="${src}" alt="" onerror="this.style.visibility='hidden'"><span><b>${esc(p.name)}</b> · Lv.${p.abilities[ability]}</span></span>`;}'''
          extra=anchor+'''
          function teamPalChip(member,inner=''){const p=member.pal||member,[a,b]=palFallbackColors(p),src=palHeadIcon(p);return `<span class="pal-ability-chip team-pal-chip" data-palette-src="${src}" style="--pal-a:${a};--pal-b:${b}"><img src="${src}" alt="" onerror="this.style.visibility='hidden'"><span class="team-pal-copy"><b>${esc(p.name)}</b>${inner}</span></span>`;}
          function coverageChip(f,v){const fac=facilityMap.get(f),name=fac?.name||f;return `<span class="coverage-chip ${v.hit===v.total?'full':''}">${fac?.icon?`<img src="${asset(fac.icon)}" alt="">`:''}<span>${esc(name)}</span><b>${v.hit}/${v.total}</b></span>`;}'''
          if s.count(anchor)!=1: raise SystemExit("team helper anchor")
          s=s.replace(anchor,extra,1)

          start=s.index("function traitMarkup")
          end=s.index("\nfunction renderAll()",start)
          block='''function traitMarkup(h){return`<span class="traits">${(h?.display||[]).map(x=>{const names=(x.facilities||[]).map(f=>facilityMap.get(f)?.name||f),boost=names.length?` · +20% to ${names.join(', ')}`:'';return`<span class="trait ${x.status}" title="${esc(x.status==='must'?`Required for primary role${boost}`:x.status==='nice'?`Useful secondary role${boost}`:'No relevant preference')}">${esc(x.char)}</span>`;}).join('')}</span>`;}
          function renderSpecial(s){const base=state.target==='coin'?currentPlan.ratePerHour:currentPlan.targetRate,actual=state.target==='coin'?s.ev.rate:s.ev.targetRate,ratio=base?actual/base:0,delta=actual-base;return`<div class="result-card special"><div class="result-label">Special #1 · ideal legal personalities for the real team</div><div class="result-rate">${fmt1(actual)} ${esc(objectiveName())}/h</div><div class="result-delta">${pct(ratio)} of generic objective · ${delta>=0?'+':''}${fmt1(delta)}/h · ${fmt(s.ev.rate)} coin/h</div><div class="chips team-chip-grid">${s.team.map((x,i)=>teamPalChip(x,traitMarkup(s.ev.traitHints?.[i]))).join('')}</div><p class="micro"><span style="color:var(--green)">Green</span> letters belong to the worker's primary assigned structure and are kept mandatory. <span style="color:var(--amber)">Yellow</span> letters improve other plan jobs that Aniimo can cover. Hover a letter to see the exact structure receiving <b>+20%</b>. <b>o</b> means the pair is irrelevant.</p></div>`;}
          function renderTeamCard(x,index,staff){const base=state.target==='coin'?currentPlan.ratePerHour:currentPlan.targetRate,actual=state.target==='coin'?x.eval.rate:x.eval.targetRate,ratio=base?actual/base:0,delta=actual-base;let extra='';if(staff){const{core,anti}=staff;extra+=`<div class="subhead">Essential core · ${core.length}</div><div class="chips team-chip-grid">${core.map(teamPalChip).join('')}</div>`;if(anti.reserves.length)extra+=`<div class="subhead">Anti-stall / spare coverage · ${anti.reserves.length}</div><div class="chips team-chip-grid">${anti.reserves.map(teamPalChip).join('')}</div>`;extra+=`<div class="subhead">Basic-material burst coverage</div><div class="coverage">${[...anti.byFacility].map(([f,v])=>coverageChip(f,v)).join('')}</div>`;}return`<div class="result-card ${index===0?'best':''}"><div class="result-label">${index===0?'Best actual roster plan':`Alternative ${index+1}`}</div><div class="result-rate">${fmt1(actual)} ${esc(objectiveName())}/h</div><div class="result-delta">${pct(ratio)} of theoretical · ${delta>=0?'+':''}${fmt1(delta)}/h · ${fmt(x.eval.rate)} coin/h</div><div class="chips team-chip-grid">${x.team.map(teamPalChip).join('')}</div><div class="subhead">Plan rebalanced for this team · ${x.eval.rows.length} assignments</div>${extra}</div>`;}
          '''
          s=s[:start]+block+s[end:]
          old='''status.textContent=`Done · actual roster optimum and personality roles calculated`;box.innerHTML=(special?renderSpecial(special):'')+teams.map((x,i)=>renderTeamCard(x,i,i===0?{core,anti}:null)).join('');'''
          new=old+"applyPalGradients();"
          if s.count(old)!=1: raise SystemExit("gradient anchor")
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path("styles.css")
          s=p.read_text()
          add='''

          /* --- real-team result polish --- */
          .team-chip-grid{gap:6px}
          .team-pal-chip{min-height:28px;padding:4px 7px 4px 4px}
          .team-pal-chip>img{width:22px;height:22px;flex-basis:22px}
          .team-pal-copy{display:flex;align-items:center;gap:6px;min-width:0}
          .team-pal-copy>b{white-space:nowrap}
          .team-pal-copy .traits{margin-left:2px}
          .coverage{gap:6px}
          .coverage-chip{display:inline-flex!important;align-items:center;gap:5px!important;padding:4px 7px 4px 4px!important}
          .coverage-chip img{width:18px;height:18px;object-fit:contain}
          .coverage-chip b{font-size:8px;color:#cbd2d9}
          .coverage-chip.full b{color:var(--green)}
          '''
          if "/* --- real-team result polish --- */" not in s:s+=add
          p.write_text(s)

          Path(".github/workflows/real-team-polish.yml").unlink()
          PY

      - name: Verify
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/optimizer.js
          node test.mjs
          node test-team.mjs

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish real-team analyzer visuals"
          git push origin HEAD:main
